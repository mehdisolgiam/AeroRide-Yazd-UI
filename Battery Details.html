<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AeroRide Battery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100vh;

            background: #ffd89b;
            background: -webkit-linear-gradient(to right, #19547b, #ffd89b);
            background: linear-gradient(to right, #19547b, #ffd89b);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                Oxygen,
                Ubuntu,
                sans-serif;

            color: white;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: 100%;
            max-width: 600px;

            padding: 30px 35px;

            background:
                rgba(58, 58, 58, 0.15);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border:
                1px solid rgba(255, 255, 255, 0.3);

            border-radius: 40px;

            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }


        /* =========================
           HEADER
        ========================= */

        .settings-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;
        }


        .title {

            font-family: "Cinzel", sans-serif;

            font-size: 1.6rem;

            font-weight: 600;

            letter-spacing: 1px;

            color: white;
        }


        /* =========================
           HOME BUTTON
        ========================= */

        .back-btn {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            border-radius: 15px;

            backdrop-filter: blur(10px);

            transition: all 0.25s ease;
        }


        .back-btn:hover {

            background:
                rgba(255, 255, 255, 0.25);

            transform: scale(1.05);
        }


        .menu-icon {

            width: 24px;
            height: 24px;

            object-fit: contain;
        }


        /* =========================
           HR
        ========================= */

        hr {

            width: 70%;

            border: none;

            height: 1px;

            background:
                linear-gradient(to right,
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);

            margin: 12px auto 18px;
        }


        /* =========================
           BATTERY GROUP
        ========================= */

        .battery-group {

            display: flex;

            flex-direction: column;

            gap: 12px;

            margin-bottom: 25px;
        }


        .group-title {

            font-size: 0.85rem;

            color:
                rgba(255, 255, 255, 0.65);

            margin-bottom: 3px;

            padding-right: 5px;
        }


        /* =========================
           BATTERY ITEM
        ========================= */

        .battery-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 16px 18px;

            min-height: 65px;

            background:
                rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border:
                1px solid rgba(255, 255, 255, 0.18);

            border-radius: 22px;

            box-shadow:
                inset 0 1px 3px rgba(255, 255, 255, 0.12),

                0 8px 20px rgba(0, 0, 0, 0.15);
        }


        .battery-info {

            display: flex;

            flex-direction: column;

            gap: 4px;
        }


        .battery-name {

            font-size: 0.95rem;

            font-weight: 600;
        }


        .battery-description {

            font-size: 0.75rem;

            color:
                rgba(255, 255, 255, 0.55);
        }


        /* =========================
           BATTERY VALUE
        ========================= */

        .battery-value {

            font-size: 1.1rem;

            font-weight: 700;

            color: #55e878;
        }


        /* =========================
           BATTERY BAR
        ========================= */

        .battery-bar-container {

            width: 100%;

            height: 12px;

            margin-top: 3px;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.18);

            border-radius: 20px;

            overflow: hidden;
        }


        .battery-bar {

            width: 85%;

            height: 100%;

            background: #55e878;

            border-radius: 20px;

            transition: width 0.5s ease;
        }


        /* =========================
           SAVE BUTTON
        ========================= */

        .save-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 25px;

            color: white;

            font-size: 1rem;

            font-weight: 600;

            cursor: pointer;

            background:
                rgba(255, 255, 255, 0.18);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(10px);

            transition: all 0.25s ease;
        }


        .save-btn:hover {

            background:
                rgba(50, 205, 100, 0.35);

            border-color:
                rgba(100, 255, 140, 0.7);

            transform: translateY(-2px);
        }

        /* =====================================================
   BATTERY DETAILS
===================================================== */

        .battery-details {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-top: 20px;
        }


        /* =====================================================
   BATTERY CARD
===================================================== */

        .battery-card {

            min-height: 110px;

            padding: 18px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 7px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border:
                1px solid rgba(255, 255, 255, 0.22);

            border-radius: 25px;

            box-shadow:

                inset 0 1px 3px rgba(255, 255, 255, 0.15),

                0 8px 20px rgba(0, 0, 0, 0.18);

        }


        /* =====================================================
   BATTERY ICON
===================================================== */

        .battery-card-icon {

            width: 30px;
            height: 30px;

            object-fit: contain;

            margin-bottom: 3px;
        }


        /* =====================================================
   LABEL
===================================================== */

        .battery-card-label {

            font-size:
                0.75rem;

            color:
                rgba(255, 255, 255, 0.65);
        }


        /* =====================================================
   VALUE
===================================================== */

        .battery-card-value {

            font-size:
                1.15rem;

            font-weight:
                600;

            color:
                white;

            direction: ltr;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
   UNIT
===================================================== */

        .battery-card-unit {

            font-size:
                0.7rem;

            color:
                rgba(255, 255, 255, 0.55);
        }


        /* =====================================================
   HEALTH STATUS
===================================================== */

        .battery-health {

            color:
                #55e878;
        }

        @media (max-width: 600px) {

            body {

                display: block;

                padding: 0;
            }


            .container {

                width: 100%;

                max-width: none;

                min-height: 100vh;
                min-height: 100dvh;

                padding: 25px 18px;

                border-radius: 0;

                border: none;

                box-shadow: none;
            }


            .title {

                font-size: 1.35rem;
            }


            .battery-item {

                padding: 15px;

                border-radius: 20px;
            }

            .battery-details {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;
            }


            .battery-card {

                min-height: 95px;

                padding: 12px;
            }


            .battery-card-icon {

                width: 26px;
                height: 26px;
            }


            .battery-card-value {

                font-size:
                    1rem;
            }

        }
    </style>

</head>


<body>

    <main class="container">

        <div class="settings-header" dir="rtl">

            <h1 class="title"> Aero Battery </h1>

            <a href="./index.html" class="back-btn"> <img src="https://img.icons8.com/?size=96&id=81iygwWJnoDA&format=png"
                    class="menu-icon" alt="Home"> </a>

        </div>


        <hr>

        <div class="battery-group">

            <div class="group-title">
                Battery Information
            </div>


            <div class="battery-item">

                <div class="battery-info">
                    <span class="battery-name"> Battery Level </span>
                    <span class="battery-description"> Current battery charge </span>
                </div>

                <span class="battery-value" id="batteryValue"> 85% </span>

            </div>

            <div class="battery-bar-container">

                <div class="battery-bar" id="batteryBar">
                </div>

            </div>


            <!-- Battery Current -->

            <div class="battery-item">

                <div class="battery-info">

                    <span class="battery-name">
                        Current
                    </span>

                    <span class="battery-description">
                        Current battery consumption
                    </span>

                </div>


                <span class="battery-value" id="batteryCurrent">
                    0 A
                </span>

            </div>

            <div class="battery-item">

                <div class="battery-info">

                    <span class="battery-name">
                        tawan masrafi
                    </span>

                    <span class="battery-description">
                        tawan masrafi
                    </span>

                </div>


                <span class="battery-value" id="batteryPowerUsage">0 W</span>
            </div>

            <!-- =====================================================
                BATTERY DETAILS
            ===================================================== -->

            <div class="battery-details">


                <!-- =========================
                    BATTERY HEALTH
                ========================= -->

                <div class="battery-card">

                    <img src="https://img.icons8.com/?size=96&id=ta8XUOXsu565&format=png" class="battery-card-icon"
                        alt="Battery Health">

                    <span class="battery-card-label">
                        Battery Health
                    </span>

                    <span class="battery-card-value battery-health" id="batteryHealth">

                        98%

                    </span>

                </div>


                <!-- =========================
                    CHARGING CYCLES
                ========================= -->

                <div class="battery-card">

                    <img src="https://img.icons8.com/?size=96&id=7lhJe4LCHiiE&format=png" class="battery-card-icon"
                        alt="Charging Cycles">

                    <span class="battery-card-label">
                        Charging Cycles
                    </span>

                    <span class="battery-card-value" id="chargingCycles">

                        127

                    </span>

                </div>


                <!-- =========================
                    BATTERY TEMPERATURE
                ========================= -->

                <div class="battery-card">

                    <img src="https://img.icons8.com/?size=96&id=PS1oJILpqqiu&format=png" class="battery-card-icon"
                        alt="Battery Temperature">

                    <span class="battery-card-label">
                        Battery Temperature
                    </span>

                    <span class="battery-card-value" id="batteryTemperature">

                        32
                        <span class="battery-card-unit"> °C </span>
                    </span>



                </div>


                <!-- =========================
                    BATTERY VOLTAGE
                ========================= -->

                <div class="battery-card">

                    <img src="https://img.icons8.com/?size=96&id=s1oXbVuefB6a&format=png" class="battery-card-icon"
                        alt="Battery Voltage">

                    <span class="battery-card-label">
                        Battery Voltage
                    </span>

                    <span class="battery-card-value" id="batteryVoltage">
                        42.0
                        <span class="battery-card-unit"> V </span>
                    </span>



                </div>

            </div>



        </div>


        <hr>


        <button class="save-btn">
            Save Settings
        </button>


    </main>

</body>

</html>
