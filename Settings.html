<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AeroRide Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100vh;

            background: #ffd89b;
            background: -webkit-linear-gradient(to right, #19547b, #ffd89b);
            background: linear-gradient(to right, #19547b, #ffd89b);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                Oxygen,
                Ubuntu,
                sans-serif;

            color: white;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .container {

            width: 100%;
            max-width: 600px;

            padding: 30px 35px;

            background:
                rgba(58, 58, 58, 0.15);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border:
                1px solid rgba(255, 255, 255, 0.3);

            border-radius: 40px;

            box-shadow:
                0 25px 50px -12px
                rgba(0, 0, 0, 0.5);
        }


        .settings-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;
        }


        .title {

            font-family: "Cinzel", sans-serif;

            font-size: 1.6rem;

            font-weight: 600;

            letter-spacing: 1px;

            color: white;
        }


        .back-btn {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            border-radius: 15px;

            backdrop-filter: blur(10px);

            transition: all 0.25s ease;
        }


        .back-btn:hover {

            background:
                rgba(255, 255, 255, 0.25);

            transform: scale(1.05);
        }


        .menu-icon {

            width: 24px;
            height: 24px;

            object-fit: contain;
        }


        hr {

            width: 70%;

            border: none;

            height: 1px;

            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );

            margin: 12px auto 18px;
        }


        .save-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 25px;

            color: white;

            font-size: 1rem;

            font-weight: 600;

            cursor: pointer;

            background:
                rgba(255, 255, 255, 0.18);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(10px);

            transition: all 0.25s ease;
        }


        .save-btn:hover {

            background:
                rgba(50, 205, 100, 0.35);

            border-color:
                rgba(100, 255, 140, 0.7);

            transform: translateY(-2px);
        }


        @media (max-width: 600px) {

            body {

                display: block;

                padding: 0;
            }


            .container {

                width: 100%;

                max-width: none;

                min-height: 100vh;
                min-height: 100dvh;

                padding: 25px 18px;

                border-radius: 0;

                border: none;

                box-shadow: none;
            }


            .title {

                font-size: 1.35rem;
            }

        }

    </style>

</head>


<body>

    <main class="container">

        <div class="settings-header">

            <h1 class="title">
                Aero Settings
            </h1>

            <a href="/" class="back-btn"> <img src="https://img.icons8.com/?size=96&id=81iygwWJnoDA&format=png" class="menu-icon" alt="Home"> </a>

        </div>

        

        <hr/>
        <button class="save-btn">
            Save Settings
        </button>

    </main>

</body>

</html>
