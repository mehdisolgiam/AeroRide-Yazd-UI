<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AeroRide Navigation</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        html,
        body {

            width: 100%;
            min-height: 100vh;

            background:
                linear-gradient(to right,
                    #19547b,
                    #ffd89b);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Oxygen,
                Ubuntu,
                sans-serif;

            color: white;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {

            width: 100%;
            max-width: 600px;

            padding: 30px 35px;

            background:
                rgba(58, 58, 58, 0.15);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border:
                1px solid rgba(255, 255, 255, 0.3);

            border-radius: 40px;

            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .navigation-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;
        }


        .title {

            font-family:
                "Cinzel",
                sans-serif;

            font-size: 1.6rem;

            font-weight: 600;

            letter-spacing: 1px;

            color: white;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-btn {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            border-radius: 15px;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                all 0.25s ease;
        }


        .back-btn:hover {

            background:
                rgba(255, 255, 255, 0.25);

            transform:
                scale(1.05);
        }


        .menu-icon {

            width: 24px;
            height: 24px;

            object-fit: contain;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        hr {

            width: 70%;

            border: none;

            height: 1px;

            background:
                linear-gradient(to right,
                    transparent,
                    rgba(255, 255, 255, 0.3),
                    transparent);

            margin:
                12px auto 18px;
        }


        /* =====================================================
           INFORMATION CARDS
        ===================================================== */

        .info-container {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-bottom: 15px;
        }


        .info-card {

            min-height: 100px;

            padding: 18px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            border-radius: 25px;

            box-shadow:

                inset 0 1px 4px rgba(255, 255, 255, 0.15),

                0 8px 20px rgba(0, 0, 0, 0.18);
        }


        .info-icon {

            width: 32px;
            height: 32px;

            object-fit: contain;

            margin-bottom: 7px;

            filter:
                brightness(0) invert(1);
        }


        .info-label {

            display: block;

            font-size: 0.75rem;

            color:
                rgba(255, 255, 255, 0.7);

            margin-bottom: 5px;
        }


        .info-value {

            display: block;

            font-size: 1rem;

            font-weight: 600;

            color: white;
        }


        /* =====================================================
           NAVIGATION INFORMATION
        ===================================================== */

        .navigation-info {

            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }


        .navigation-card {

            min-height: 105px;

            padding: 15px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 6px;

            background:
                rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border:
                1px solid rgba(255, 255, 255, 0.22);

            border-radius: 22px;

            box-shadow:

                inset 0 1px 3px rgba(255, 255, 255, 0.15),

                0 8px 20px rgba(0, 0, 0, 0.18);

            transition:
                all 0.25s ease;
        }


        .navigation-card:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255, 255, 255, 0.13);
        }


        .navigation-label {

            font-size:
                0.75rem;

            color:
                rgba(255, 255, 255, 0.6);
        }


        .navigation-value {

            font-size:
                1.25rem;

            font-weight:
                600;

            color:
                white;

            direction: ltr;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.25);
        }


        .navigation-unit {

            font-size:
                0.7rem;

            color:
                rgba(255, 255, 255, 0.55);
        }


        /* =====================================================
           LOCATION
        ===================================================== */

        .location-card {

            width: 100%;

            padding: 18px;

            margin-bottom: 20px;

            background:
                rgba(255, 255, 255, 0.10);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border:
                1px solid rgba(255, 255, 255, 0.22);

            border-radius: 25px;

            text-align: center;
        }


        .location-title {

            font-family:
                "Cinzel",
                sans-serif;

            font-size: 1rem;

            margin-bottom: 12px;
        }


        .coordinates {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .coordinate {

            padding:
                8px 14px;

            background:
                rgba(255, 255, 255, 0.10);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            border-radius: 15px;

            font-size: 0.8rem;
        }


        /* =====================================================
           MAP
        ===================================================== */

        #map {

            width: 100%;

            height: 280px;

            margin-top: 5px;

            border-radius: 30px;

            overflow: hidden;

            border:
                1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.3);
        }


        /* =====================================================
           CURRENT LOCATION BUTTON
        ===================================================== */

        .location-btn {

            width: 100%;

            padding: 14px;

            margin-top: 18px;

            border: none;

            border-radius: 25px;

            color: white;

            font-size: 1rem;

            font-weight: 600;

            cursor: pointer;

            background:
                rgba(255, 255, 255, 0.18);

            border:
                1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                all 0.25s ease;
        }


        .location-btn:hover {

            background:
                rgba(255, 255, 255, 0.28);

            transform:
                translateY(-2px);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                display: block;

                padding: 0;
            }


            .container {

                width: 100%;

                max-width: none;

                min-height: 100vh;

                min-height: 100dvh;

                padding:
                    25px 18px;

                border-radius: 0;

                border: none;

                box-shadow: none;
            }


            .title {

                font-size:
                    1.35rem;
            }


            .info-container {

                gap: 10px;
            }


            .info-card {

                min-height: 90px;

                padding: 12px;
            }


            .info-value {

                font-size:
                    0.9rem;
            }


            .navigation-info {

                gap: 10px;
            }


            .navigation-card {

                min-height: 95px;

                padding: 13px;
            }


            .navigation-value {

                font-size:
                    1rem;
            }


            #map {

                height:
                    240px;

                border-radius:
                    25px;
            }
        }
    </style>

</head>


<body>


    <main class="container">


        <!-- =====================================================
         HEADER
    ===================================================== -->

        <div class="navigation-header">

            <h1 class="title">
                Aero Nav
            </h1>


            <a href="./index.html" class="back-btn">

                <img src="https://img.icons8.com/?size=96&id=81iygwWJnoDA&format=png" class="menu-icon" alt="Home">

            </a>

        </div>


        <hr>


        <!-- =====================================================
         BASIC INFORMATION
    ===================================================== -->

        <div class="info-container">


            <!-- DISTANCE -->

            <div class="info-card">

                <img src="https://img.icons8.com/?size=96&id=GGqZsTSr1KKc&format=png" class="info-icon" alt="Distance">


                <div class="info-content">

                    <span class="info-label">
                        Distance Traveled
                    </span>


                    <span class="info-value" id="distanceValue">

                        0.00 km

                    </span>

                </div>

            </div>


            <!-- GPS -->

            <div class="info-card">

                <img src="https://img.icons8.com/?size=96&id=s0vJQMKvmaAl&format=png" class="info-icon" alt="GPS">


                <div class="info-content">

                    <span class="info-label">
                        GPS Status
                    </span>


                    <span class="info-value" id="gpsStatus">

                        Connected

                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================================
         NAVIGATION INFORMATION
    ===================================================== -->

        <div class="navigation-info">


            <!-- TRAVEL TIME -->

            <div class="info-card">

                <span class="navigation-label">
                    Travel Time
                </span>


                <span class="navigation-value" id="travelTime">

                    00:00:00

                </span>

            </div>


            <!-- AVERAGE SPEED -->

            <div class="info-card">

                <span class="navigation-label">
                    Average Speed
                </span>


                <span class="navigation-value" id="averageSpeed">

                    0.0

                </span>


                <span class="navigation-unit">
                    km/h
                </span>

            </div>

        </div>

        <hr/>


        <!-- =====================================================
         CURRENT LOCATION
    ===================================================== -->

        <div class="location-card">

            <div class="location-title">
                Current Location
            </div>


            <div class="coordinates">

                <div class="coordinate">

                    Latitude:

                    <span id="latitude">
                        30.406900
                    </span>

                </div>


                <div class="coordinate">

                    Longitude:

                    <span id="longitude">
                        55.084700
                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================================
         MAP
    ===================================================== -->

        <div id="map"></div>


        <!-- =====================================================
         LOCATION BUTTON
    ===================================================== -->

        <button class="location-btn" id="locationBtn">

            📍 Go to Current Location

        </button>


    </main>


    <!-- =====================================================
     LEAFLET
===================================================== -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        /* =====================================================
           INITIAL GPS LOCATION
        ===================================================== */

        let latitude = 30.4069;

        let longitude = 55.0847;


        /* =====================================================
           DISTANCE VARIABLES
        ===================================================== */

        let totalDistance = 0;

        let previousLatitude = latitude;

        let previousLongitude = longitude;


        /* =====================================================
           TRAVEL TIME VARIABLES
        ===================================================== */

        let tripStarted = false;

        let tripStartTime = null;

        let travelTimer = null;


        /* =====================================================
           CALCULATE DISTANCE
        ===================================================== */

        function calculateDistance(
            lat1,
            lon1,
            lat2,
            lon2
        ) {

            const R = 6371;


            const dLat =
                (lat2 - lat1) *
                Math.PI / 180;


            const dLon =
                (lon2 - lon1) *
                Math.PI / 180;


            const a =
                Math.sin(dLat / 2) *
                Math.sin(dLat / 2)

                +

                Math.cos(
                    lat1 * Math.PI / 180
                )

                *

                Math.cos(
                    lat2 * Math.PI / 180
                )

                *

                Math.sin(dLon / 2) *
                Math.sin(dLon / 2);


            const c =
                2 *
                Math.atan2(
                    Math.sqrt(a),
                    Math.sqrt(1 - a)
                );


            return R * c;
        }


        /* =====================================================
           FORMAT TRAVEL TIME
        ===================================================== */

        function formatTravelTime(seconds) {

            const hours =
                Math.floor(seconds / 3600);


            const minutes =
                Math.floor(
                    (seconds % 3600) / 60
                );


            const secs =
                Math.floor(seconds % 60);


            return (

                String(hours).padStart(2, "0")

                + ":" +

                String(minutes).padStart(2, "0")

                + ":" +

                String(secs).padStart(2, "0")

            );
        }


        /* =====================================================
           UPDATE TRAVEL TIME
        ===================================================== */

        function updateTravelTime() {

            if (!tripStarted || !tripStartTime) {
                return;
            }


            const elapsedSeconds =
                (Date.now() - tripStartTime) / 1000;


            document.getElementById(
                "travelTime"
            ).textContent =
                formatTravelTime(
                    elapsedSeconds
                );


            /* =================================================
               AVERAGE SPEED
    
               Speed = Distance / Time
    
               Distance -> km
               Time     -> hours
            ================================================= */

            if (elapsedSeconds > 0) {

                const elapsedHours =
                    elapsedSeconds / 3600;


                const averageSpeed =
                    totalDistance /
                    elapsedHours;


                document.getElementById(
                    "averageSpeed"
                ).textContent =
                    averageSpeed.toFixed(1);
            }

        }


        /* =====================================================
           START TRIP
        ===================================================== */

        function startTrip() {

            if (tripStarted) {
                return;
            }


            tripStarted = true;

            tripStartTime =
                Date.now();


            travelTimer =
                setInterval(
                    updateTravelTime,
                    1000
                );

        }


        /* =====================================================
           STOP TRIP
        ===================================================== */

        function stopTrip() {

            if (!tripStarted) {
                return;
            }


            tripStarted = false;


            clearInterval(
                travelTimer
            );


            travelTimer = null;

        }


        /* =====================================================
           MAP
        ===================================================== */

        const map =
            L.map("map").setView(
                [latitude, longitude],
                15
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 19,

                attribution:
                    "© AeroRide Map"

            }

        ).addTo(map);


        /* =====================================================
           MARKER
        ===================================================== */

        const marker =
            L.marker(
                [latitude, longitude]
            ).addTo(map);


        marker.bindPopup(
            "AeroRider - Current Location"
        );


        /* =====================================================
           UPDATE GPS LOCATION
        ===================================================== */

        function updateLocation(
            newLatitude,
            newLongitude
        ) {

            /* =============================================
               START TRIP
    
               اولین دریافت GPS یعنی شروع سفر
            ============================================= */

            startTrip();


            /* =============================================
               CALCULATE DISTANCE
            ============================================= */

            const distance =
                calculateDistance(
                    previousLatitude,
                    previousLongitude,
                    newLatitude,
                    newLongitude
                );


            /* =============================================
               IGNORE GPS NOISE
    
               اگر تغییر خیلی کوچک باشد،
               به عنوان حرکت واقعی حساب نمی‌شود.
            ============================================= */

            if (distance > 0.003) {

                totalDistance += distance;

            }


            /* =============================================
               SAVE NEW POSITION
            ============================================= */

            previousLatitude =
                newLatitude;

            previousLongitude =
                newLongitude;


            latitude =
                newLatitude;

            longitude =
                newLongitude;


            /* =============================================
               UPDATE COORDINATES
            ============================================= */

            document.getElementById(
                "latitude"
            ).textContent =
                latitude.toFixed(6);


            document.getElementById(
                "longitude"
            ).textContent =
                longitude.toFixed(6);


            /* =============================================
               UPDATE DISTANCE
            ============================================= */

            document.getElementById(
                "distanceValue"
            ).textContent =
                totalDistance.toFixed(2)
                + " km";


            /* =============================================
               UPDATE GPS STATUS
            ============================================= */

            document.getElementById(
                "gpsStatus"
            ).textContent =
                "Connected";


            /* =============================================
               MOVE MARKER
            ============================================= */

            marker.setLatLng([
                latitude,
                longitude
            ]);


            /* =============================================
               MOVE MAP
            ============================================= */

            map.setView(
                [
                    latitude,
                    longitude
                ],
                15
            );


            /* =============================================
               UPDATE AVERAGE SPEED
            ============================================= */

            updateTravelTime();

        }


        /* =====================================================
           CURRENT LOCATION BUTTON
        ===================================================== */

        document
            .getElementById("locationBtn")
            .addEventListener(
                "click",
                function () {

                    map.setView(
                        [
                            latitude,
                            longitude
                        ],
                        17
                    );


                    marker.openPopup();

                }
            );


        /* =====================================================
           GPS ERROR
        ===================================================== */

        function gpsDisconnected() {

            document.getElementById(
                "gpsStatus"
            ).textContent =
                "Disconnected";

        }


        /* =====================================================
           TEST GPS
           
           این قسمت فقط برای تست است.
    
           وقتی GPS واقعی را به ESP32/STM32
           وصل کردی، این بخش را حذف کن.
        ===================================================== */

        let testLongitude = longitude;
    
    
        setInterval(function () {
    
            testLatitude += 0.00015;
    
            testLongitude += 0.00015;
    
    
            updateLocation(
                testLatitude,
                testLongitude
            );
    
        }, 5000);
    
        */


    </script>


</body>

</html>
